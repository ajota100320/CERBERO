{% extends "base.html" %}

{% block title %}{{ title }} - ERP Gastronómico{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">{{ title }}</h1>
            <p class="text-gray-500 mt-1">Registrar nueva merma de inventario</p>
        </div>
        <a href="/mermas" class="text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <form method="POST" action="{{ action }}" class="space-y-6">
            <div>
                <label for="ingrediente_id" class="block text-sm font-medium text-gray-700 mb-1">Ingrediente <span class="text-red-500">*</span></label>
                <select name="ingrediente_id" id="ingrediente_id" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                    <option value="">Seleccionar ingrediente</option>
                    {% for ing in ingredientes %}
                    <option value="{{ ing.id }}" data-stock="{{ ing.stock_actual }}" data-costo="{{ ing.costo_promedio }}" data-unidad="{{ ing.unidad_medida.value }}">
                        {{ ing.nombre }} (Stock: {{ ing.stock_actual }} {{ ing.unidad_medida.value }} - $ {{ ing.costo_promedio }}/{{ ing.unidad_medida.value }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="tipo" class="block text-sm font-medium text-gray-700 mb-1">Tipo de Merma <span class="text-red-500">*</span></label>
                    <select name="tipo" id="tipo" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        {% for t in tipos %}
                        <option value="{{ t.value }}">{{ t.value }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="cantidad" class="block text-sm font-medium text-gray-700 mb-1">Cantidad <span class="text-red-500">*</span></label>
                    <input type="number" name="cantidad" id="cantidad" required step="0.01" min="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="0.00">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="fecha_merma" class="block text-sm font-medium text-gray-700 mb-1">Fecha <span class="text-red-500">*</span></label>
                    <input type="date" name="fecha_merma" id="fecha_merma" required value="{{ today }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label for="responsable" class="block text-sm font-medium text-gray-700 mb-1">Responsable</label>
                    <input type="text" name="responsable" id="responsable" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Nombre del responsable">
                </div>
            </div>

            <div>
                <label for="observaciones" class="block text-sm font-medium text-gray-700 mb-1">Observaciones</label>
                <textarea name="observaciones" id="observaciones" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Detalles de la merma..."></textarea>
            </div>

            <!-- Preview de valor de pérdida -->
            <div id="previewContainer" class="bg-gray-50 rounded-lg p-4 hidden">
                <p class="text-sm font-medium text-gray-700">Vista previa:</p>
                <p class="text-lg font-bold text-red-600">Valor estimado de pérdida: $<span id="previewValor">0</span></p>
                <p class="text-sm text-gray-500">Stock disponible: <span id="previewStock">0</span> <span id="previewUnidad"></span></p>
            </div>

            <div class="flex justify-end space-x-4 pt-4 border-t border-gray-200">
                <a href="/mermas" class="px-4 py-2 border border-gray-300 rounded-lg font-medium text-gray-700 hover:bg-gray-50 transition-colors">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 transition-colors">Registrar Merma</button>
            </div>
        </form>
    </div>
</div>

<script>
const ingredienteSelect = document.getElementById('ingrediente_id');
const cantidadInput = document.getElementById('cantidad');
const previewContainer = document.getElementById('previewContainer');
const previewValor = document.getElementById('previewValor');
const previewStock = document.getElementById('previewStock');
const previewUnidad = document.getElementById('previewUnidad');

function updatePreview() {
    const selectedOption = ingredienteSelect.options[ingredienteSelect.selectedIndex];
    const cantidad = parseFloat(cantidadInput.value) || 0;
    
    if (selectedOption.value && cantidad > 0) {
        const stock = parseFloat(selectedOption.dataset.stock) || 0;
        const costo = parseFloat(selectedOption.dataset.costo) || 0;
        const unidad = selectedOption.dataset.unidad || '';
        
        const valor = cantidad * costo;
        
        previewValor.textContent = valor.toLocaleString('es-CL', {minimumFractionDigits: 0, maximumFractionDigits: 2});
        previewStock.textContent = stock.toLocaleString('es-CL', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        previewUnidad.textContent = unidad;
        previewContainer.classList.remove('hidden');
        
        // Warn if stock insufficient
        if (cantidad > stock) {
            previewContainer.classList.add('bg-red-50', 'border', 'border-red-200');
            previewContainer.classList.remove('bg-gray-50');
            previewValor.classList.add('text-red-600');
        } else {
            previewContainer.classList.remove('bg-red-50', 'border', 'border-red-200');
            previewContainer.classList.add('bg-gray-50');
        }
    } else {
        previewContainer.classList.add('hidden');
    }
}

ingredienteSelect.addEventListener('change', updatePreview);
cantidadInput.addEventListener('input', updatePreview);
</script>
{% endblock %}
