{% extends "base.html" %}

{% block title %}{{ title }} - ERP Gastronómico{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">{{ title }}</h1>
            <p class="text-gray-500 mt-1">Registrar medición de temperatura de equipos</p>
        </div>
        <a href="/temperaturas" class="text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <form method="POST" action="{{ action }}" class="space-y-6" id="tempForm">
            <div>
                <label for="equipo_nombre" class="block text-sm font-medium text-gray-700 mb-1">Equipo <span class="text-red-500">*</span></label>
                <input type="text" name="equipo_nombre" id="equipo_nombre" required value="{{ registro.equipo_nombre if registro else '' }}" list="equiposList" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Ej: Refrigerador 1, Freezer Cocina, Horno Principal">
                <datalist id="equiposList">
                    {% for eq in equipos %}
                    <option value="{{ eq }}">{{ eq }}</option>
                    {% endfor %}
                </datalist>
            </div>

            <div>
                <label for="equipo_ubicacion" class="block text-sm font-medium text-gray-700 mb-1">Ubicación</label>
                <input type="text" name="equipo_ubicacion" id="equipo_ubicacion" value="{{ registro.equipo_ubicacion if registro else '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Ej: Cocina principal, Bodega, etc.">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label for="temperatura" class="block text-sm font-medium text-gray-700 mb-1">Temperatura Actual (°C) <span class="text-red-500">*</span></label>
                    <input type="number" name="temperatura" id="temperatura" required step="0.1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="0.0">
                </div>
                <div>
                    <label for="temperatura_objetivo_min" class="block text-sm font-medium text-gray-700 mb-1">Temp. Mínima Objetivo (°C) <span class="text-red-500">*</span></label>
                    <input type="number" name="temperatura_objetivo_min" id="temperatura_objetivo_min" required step="0.1" value="{{ registro.temperatura_objetivo_min if registro else 0.0 }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="0.0">
                </div>
                <div>
                    <label for="temperatura_objetivo_max" class="block text-sm font-medium text-gray-700 mb-1">Temp. Máxima Objetivo (°C) <span class="text-red-500">*</span></label>
                    <input type="number" name="temperatura_objetivo_max" id="temperatura_objetivo_max" required step="0.1" value="{{ registro.temperatura_objetivo_max if registro else 4.0 }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="4.0">
                </div>
            </div>

            <!-- Preview del rango -->
            <div id="rangePreview" class="bg-gray-50 rounded-lg p-4 hidden">
                <p class="text-sm font-medium text-gray-700">Vista previa del rango:</p>
                <div class="flex items-center space-x-4 mt-2">
                    <div class="flex-1 h-4 bg-blue-100 rounded relative">
                        <div id="minMarker" class="absolute top-0 bottom-0 w-px bg-blue-600" style="left: 0%"></div>
                        <div id="maxMarker" class="absolute top-0 bottom-0 w-px bg-blue-600" style="right: 0%"></div>
                        <div id="currentMarker" class="absolute top-[-8px] bottom-0 w-3 bg-red-600 rounded transform -translate-x-1/2" style="left: 50%"></div>
                    </div>
                    <span id="rangeText" class="text-sm text-gray-600 whitespace-nowrap">-</span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="fecha_medicion" class="block text-sm font-medium text-gray-700 mb-1">Fecha <span class="text-red-500">*</span></label>
                    <input type="date" name="fecha_medicion" id="fecha_medicion" required value="{{ today }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label for="hora_medicion" class="block text-sm font-medium text-gray-700 mb-1">Hora <span class="text-red-500">*</span></label>
                    <input type="time" name="hora_medicion" id="hora_medicion" required value="{{ now }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="responsable" class="block text-sm font-medium text-gray-700 mb-1">Responsable <span class="text-red-500">*</span></label>
                    <input type="text" name="responsable" id="responsable" required value="{{ registro.responsable if registro else '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Nombre del responsable">
                </div>
                <div>
                    <label for="responsable_firma" class="block text-sm font-medium text-gray-700 mb-1">Firma</label>
                    <input type="text" name="responsable_firma" id="responsable_firma" value="{{ registro.responsable_firma if registro else '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Iniciales">
                </div>
            </div>

            <div>
                <label for="observaciones" class="block text-sm font-medium text-gray-700 mb-1">Observaciones</label>
                <textarea name="observaciones" id="observaciones" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Observaciones adicionales...">{{ registro.observaciones if registro else '' }}</textarea>
            </div>

            <div class="flex justify-end space-x-4 pt-4 border-t border-gray-200">
                <a href="/temperaturas" class="px-4 py-2 border border-gray-300 rounded-lg font-medium text-gray-700 hover:bg-gray-50 transition-colors">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 transition-colors">
                    {% if registro %}Actualizar{% else %}Registrar{% endif %} Temperatura
                </button>
            </div>
        </form>
    </div>
</div>

<script>
const tempInput = document.getElementById('temperatura');
const minInput = document.getElementById('temperatura_objetivo_min');
const maxInput = document.getElementById('temperatura_objetivo_max');
const preview = document.getElementById('rangePreview');
const minMarker = document.getElementById('minMarker');
const maxMarker = document.getElementById('maxMarker');
const currentMarker = document.getElementById('currentMarker');
const rangeText = document.getElementById('rangeText');

function updatePreview() {
    const temp = parseFloat(tempInput.value);
    const min = parseFloat(minInput.value);
    const max = parseFloat(maxInput.value);
    
    if (!isNaN(min) && !isNaN(max) && min < max) {
        preview.classList.remove('hidden');
        
        const range = max - min;
        const minPct = 0;
        const maxPct = 100;
        let currentPct = 50;
        
        if (!isNaN(temp)) {
            currentPct = ((temp - min) / range) * 100;
            currentPct = Math.max(0, Math.min(100, currentPct));
            
            const dentro = temp >= min && temp <= max;
            currentMarker.style.backgroundColor = dentro ? '#22c55e' : '#ef4444';
            rangeText.textContent = `Mín: ${min}°C | Actual: ${temp}°C | Máx: ${max}°C | ${dentro ? '✓ DENTRO DE RANGO' : '⚠ FUERA DE RANGO'}`;
            rangeText.className = `text-sm font-medium ${dentro ? 'text-green-600' : 'text-red-600'}`;
        } else {
            currentMarker.style.backgroundColor = '#9ca3af';
            rangeText.textContent = `Mín: ${min}°C | Máx: ${max}°C`;
            rangeText.className = 'text-sm text-gray-600';
        }
        
        minMarker.style.left = `${minPct}%`;
        maxMarker.style.right = `${100 - maxPct}%`;
        currentMarker.style.left = `${currentPct}%`;
    } else {
        preview.classList.add('hidden');
    }
}

[tempInput, minInput, maxInput].forEach(input => {
    input.addEventListener('input', updatePreview);
});

// Initial update
updatePreview();
</script>
{% endblock %}
