<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - ERP Gastronómico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-8">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Cambiar Contraseña
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Define tu nueva contraseña para continuar
            </p>
        </div>
        <form class="mt-8 space-y-6" action="/cambiar-password" method="post">
            {% if error %}
            <div class="mb-4 p-4 bg-red-50 text-red-800 rounded-md">
                {{ error }}
            </div>
            {% endif %}
            {% if success %}
            <div class="mb-4 p-4 bg-green-50 text-green-800 rounded-md">
                {{ success }}
            </div>
            {% endif %}
            <div>
                <label for="password_actual" class="block text-sm font-medium text-gray-700">
                    Contraseña actual
                </label>
                <div class="mt-1">
                    <input id="password_actual" name="password_actual" type="password" required autofocus
                        class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                        placeholder="********">
                </div>
            </div>
            <div>
                <label for="nueva_password" class="block text-sm font-medium text-gray-700">
                    Nueva contraseña
                </label>
                <div class="mt-1">
                    <input id="nueva_password" name="nueva_password" type="password" required minlength="8"
                        class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                        placeholder="********">
                    <p class="mt-1 text-xs text-gray-500">Mínimo 8 caracteres y distinta a la actual.</p>
                </div>
            </div>
            <div>
                <label for="confirmar_password" class="block text-sm font-medium text-gray-700">
                    Confirmar nueva contraseña
                </label>
                <div class="mt-1">
                    <input id="confirmar_password" name="confirmar_password" type="password" required minlength="8"
                        class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                        placeholder="********">
                </div>
            </div>
            <div>
                <button type="submit"
                    class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Guardar y Continuar
                </button>
            </div>
        </form>
        <p class="mt-6 text-center text-sm text-gray-500">
            <a href="/logout" class="font-medium text-indigo-600 hover:text-indigo-500">Cerrar sesión</a>
        </p>
    </div>
</body>
</html>
