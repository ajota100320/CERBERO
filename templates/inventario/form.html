{% extends "base.html" %}

{% block title %}{{ title }} - ERP Gastronómico{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">{{ title }}</h1>
            <p class="text-gray-500 mt-1">{% if ingrediente %}Editar ingrediente existente{% else %}Registrar nuevo ingrediente{% endif %}</p>
        </div>
        <a href="/inventario" class="text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <form method="POST" action="{{ action }}" class="space-y-6">
            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre <span class="text-red-500">*</span></label>
                <input type="text" name="nombre" id="nombre" required value="{{ ingrediente.nombre if ingrediente else '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Ej: Tomate Roma">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label for="categoria" class="block text-sm font-medium text-gray-700 mb-1">Categoría <span class="text-red-500">*</span></label>
                    <select name="categoria" id="categoria" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        {% for cat in categorias %}
                        <option value="{{ cat }}" {% if ingrediente and ingrediente.categoria.value == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="unidad_medida" class="block text-sm font-medium text-gray-700 mb-1">Unidad de Medida <span class="text-red-500">*</span></label>
                    <select name="unidad_medida" id="unidad_medida" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        {% for und in unidades %}
                        <option value="{{ und }}" {% if ingrediente and ingrediente.unidad_medida.value == und %}selected{% endif %}>{{ und }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="dias_alerta_vencimiento" class="block text-sm font-medium text-gray-700 mb-1">Días Alerta Venc.</label>
                    <input type="number" name="dias_alerta_vencimiento" id="dias_alerta_vencimiento" value="{{ ingrediente.dias_alerta_vencimiento if ingrediente else 3 }}" min="1" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label for="stock_actual" class="block text-sm font-medium text-gray-700 mb-1">Stock Actual <span class="text-red-500">*</span></label>
                    <input type="number" name="stock_actual" id="stock_actual" required value="{{ ingrediente.stock_actual if ingrediente else 0 }}" step="0.01" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label for="stock_minimo" class="block text-sm font-medium text-gray-700 mb-1">Stock Mínimo <span class="text-red-500">*</span></label>
                    <input type="number" name="stock_minimo" id="stock_minimo" required value="{{ ingrediente.stock_minimo if ingrediente else 0 }}" step="0.01" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label for="stock_maximo" class="block text-sm font-medium text-gray-700 mb-1">Stock Máximo</label>
                    <input type="number" name="stock_maximo" id="stock_maximo" value="{{ ingrediente.stock_maximo if ingrediente and ingrediente.stock_maximo else '' }}" step="0.01" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Opcional">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="costo_unitario" class="block text-sm font-medium text-gray-700 mb-1">Costo Unitario <span class="text-red-500">*</span></label>
                    <input type="number" name="costo_unitario" id="costo_unitario" required value="{{ ingrediente.costo_unitario if ingrediente else 0 }}" step="0.01" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label for="costo_promedio" class="block text-sm font-medium text-gray-700 mb-1">Costo Promedio <span class="text-red-500">*</span></label>
                    <input type="number" name="costo_promedio" id="costo_promedio" required value="{{ ingrediente.costo_promedio if ingrediente else 0 }}" step="0.01" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
            </div>

            {% if ingrediente %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                <div class="flex items-center">
                    <input type="checkbox" name="activo" id="activo" {% if ingrediente.activo %}checked{% endif %} class="h-4 w-4 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                    <label for="activo" class="ml-2 text-sm text-gray-700">Activo</label>
                </div>
            </div>
            {% endif %}

            <div class="flex justify-end space-x-4 pt-4 border-t border-gray-200">
                <a href="/inventario" class="px-4 py-2 border border-gray-300 rounded-lg font-medium text-gray-700 hover:bg-gray-50 transition-colors">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 transition-colors">
                    {% if ingrediente %}Actualizar{% else %}Crear{% endif %} Ingrediente
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
