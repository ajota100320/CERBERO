{% extends "base.html" %}

{% block title %}{{ title }} - ERP Gastronómico{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">{{ title }}</h1>
            <p class="text-gray-500 mt-1">Complete todos los items de verificación</p>
        </div>
        <a href="/checklist" class="text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <form method="POST" action="{{ action }}" class="space-y-6">
            <!-- Header Info -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 border-b border-gray-200 pb-6">
                <div>
                    <label for="tipo" class="block text-sm font-medium text-gray-700 mb-1">Tipo <span class="text-red-500">*</span></label>
                    <select name="tipo" id="tipo" required disabled class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50">
                        <option value="APERTURA" {% if tipo.value == 'APERTURA' %}selected{% endif %}>APERTURA</option>
                        <option value="CIERRE" {% if tipo.value == 'CIERRE' %}selected{% endif %}>CIERRE</option>
                    </select>
                </div>
                <div>
                    <label for="fecha" class="block text-sm font-medium text-gray-700 mb-1">Fecha <span class="text-red-500">*</span></label>
                    <input type="date" name="fecha" id="fecha" required value="{{ today }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label for="hora_registro" class="block text-sm font-medium text-gray-700 mb-1">Hora <span class="text-red-500">*</span></label>
                    <input type="time" name="hora_registro" id="hora_registro" required value="{{ now }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label for="responsable_nombre" class="block text-sm font-medium text-gray-700 mb-1">Responsable <span class="text-red-500">*</span></label>
                    <input type="text" name="responsable_nombre" id="responsable_nombre" required value="{{ checklist.responsable_nombre if checklist else '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Nombre completo">
                </div>
            </div>

            <input type="hidden" name="responsable_firma" id="responsable_firma" value="{{ checklist.responsable_firma if checklist else '' }}">

            <!-- Checklist Items -->
            <div>
                <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                    </svg>
                    Items de Verificación
                </h3>
                <p class="text-sm text-gray-500 mb-4">Marque cada item que cumpla con el estándar</p>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Item 1 -->
                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if checklist and checklist.cocina_limpia %}bg-green-50{% endif %}">
                        <input type="checkbox" name="cocina_limpia" value="true" {% if checklist and checklist.cocina_limpia %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Cocina limpia</span>
                    </label>

                    <!-- Item 2 -->
                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if checklist and checklist.cocina_ordenada %}bg-green-50{% endif %}">
                        <input type="checkbox" name="cocina_ordenada" value="true" {% if checklist and checklist.cocina_ordenada %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Cocina ordenada</span>
                    </label>

                    <!-- Item 3 -->
                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if checklist and checklist.basureros_vacios %}bg-green-50{% endif %}">
                        <input type="checkbox" name="basureros_vacios" value="true" {% if checklist and checklist.basureros_vacios %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Basureros vacíos</span>
                    </label>

                    <!-- Item 4 -->
                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if checklist and checklist.equipos_funcionando %}bg-green-50{% endif %}">
                        <input type="checkbox" name="equipos_funcionando" value="true" {% if checklist and checklist.equipos_funcionando %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Equipos funcionando</span>
                    </label>

                    <!-- Item 5 -->
                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if checklist and checklist.temperaturas_ok %}bg-green-50{% endif %}">
                        <input type="checkbox" name="temperaturas_ok" value="true" {% if checklist and checklist.temperaturas_ok %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Temperaturas OK</span>
                    </label>

                    <!-- Item 6 -->
                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if checklist and checklist.extintores_ok %}bg-green-50{% endif %}">
                        <input type="checkbox" name="extintores_ok" value="true" {% if checklist and checklist.extintores_ok %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Extintores OK</span>
                    </label>

                    <!-- Item 7 -->
                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if checklist and checklist.uniformes_limpios %}bg-green-50{% endif %}">
                        <input type="checkbox" name="uniformes_limpios" value="true" {% if checklist and checklist.uniformes_limpios %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Uniformes limpios</span>
                    </label>

                    <!-- Item 8 -->
                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if checklist and checklist.manos_lavadas %}bg-green-50{% endif %}">
                        <input type="checkbox" name="manos_lavadas" value="true" {% if checklist and checklist.manos_lavadas %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Manos lavadas</span>
                    </label>

                    <!-- Item 9 -->
                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if checklist and checklist.cabello_cubierto %}bg-green-50{% endif %}">
                        <input type="checkbox" name="cabello_cubierto" value="true" {% if checklist and checklist.cabello_cubierto %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Cabello cubierto</span>
                    </label>

                    <!-- Item 10 -->
                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if checklist and checklist.almacen_ordenado %}bg-green-50{% endif %}">
                        <input type="checkbox" name="almacen_ordenado" value="true" {% if checklist and checklist.almacen_ordenado %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Almacén ordenado</span>
                    </label>

                    <!-- Item 11 -->
                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if checklist and checklist.sin_plagas %}bg-green-50{% endif %}">
                        <input type="checkbox" name="sin_plagas" value="true" {% if checklist and checklist.sin_plagas %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Sin plagas</span>
                    </label>

                    <!-- Item 12 -->
                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if checklist and checklist.fecha_vencimiento_revisada %}bg-green-50{% endif %}">
                        <input type="checkbox" name="fecha_vencimiento_revisada" value="true" {% if checklist and checklist.fecha_vencimiento_revisada %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Fechas vencimiento revisadas</span>
                    </label>
                </div>
            </div>

            <!-- Observaciones -->
            <div>
                <label for="observaciones" class="block text-sm font-medium text-gray-700 mb-1">Observaciones</label>
                <textarea name="observaciones" id="observaciones" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Observaciones adicionales...">{{ checklist.observaciones if checklist else '' }}</textarea>
            </div>

            <div class="flex justify-end space-x-4 pt-4 border-t border-gray-200">
                <a href="/checklist" class="px-4 py-2 border border-gray-300 rounded-lg font-medium text-gray-700 hover:bg-gray-50 transition-colors">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 transition-colors">
                    {% if checklist %}Actualizar{% else %}Guardar{% endif %} Checklist
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
