{% extends "base.html" %}

{% block title %}{{ title }} - ERP Gastronómico{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">{{ title }}</h1>
            <p class="text-gray-500 mt-1">Complete todos los criterios de higiene</p>
        </div>
        <a href="/higiene" class="text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <form method="POST" action="{{ action }}" class="space-y-6">
            <!-- Header Info -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 border-b border-gray-200 pb-6">
                <div>
                    <label for="empleado_nombre" class="block text-sm font-medium text-gray-700 mb-1">Empleado <span class="text-red-500">*</span></label>
                    <input type="text" name="empleado_nombre" id="empleado_nombre" required value="{{ auditoria.empleado_nombre if auditoria else '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Nombre completo">
                </div>
                <div>
                    <label for="empleado_cargo" class="block text-sm font-medium text-gray-700 mb-1">Cargo</label>
                    <input type="text" name="empleado_cargo" id="empleado_cargo" value="{{ auditoria.empleado_cargo if auditoria else '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Cocinero, Ayudante, etc.">
                </div>
                <div>
                    <label for="fecha_auditoria" class="block text-sm font-medium text-gray-700 mb-1">Fecha <span class="text-red-500">*</span></label>
                    <input type="date" name="fecha_auditoria" id="fecha_auditoria" required value="{{ today }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label for="hora_auditoria" class="block text-sm font-medium text-gray-700 mb-1">Hora <span class="text-red-500">*</span></label>
                    <input type="time" name="hora_auditoria" id="hora_auditoria" required value="{{ now }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-b border-gray-200 pb-6">
                <div>
                    <label for="auditor_nombre" class="block text-sm font-medium text-gray-700 mb-1">Auditor <span class="text-red-500">*</span></label>
                    <input type="text" name="auditor_nombre" id="auditor_nombre" required value="{{ auditoria.auditor_nombre if auditoria else '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Nombre del auditor">
                </div>
                <div>
                    <label for="auditor_firma" class="block text-sm font-medium text-gray-700 mb-1">Firma Auditor</label>
                    <input type="text" name="auditor_firma" id="auditor_firma" value="{{ auditoria.auditor_firma if auditoria else '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Iniciales o firma">
                </div>
            </div>

            <!-- Checklist Items -->
            <div>
                <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                    Criterios de Higiene (Todos deben cumplirse para aprobar)
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if auditoria and auditoria.uñas_cortas_limpias %}bg-green-50{% endif %}">
                        <input type="checkbox" name="uñas_cortas_limpias" value="true" {% if auditoria and auditoria.uñas_cortas_limpias %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Uñas cortas y limpias</span>
                    </label>

                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if auditoria and auditoria.manos_limpias %}bg-green-50{% endif %}">
                        <input type="checkbox" name="manos_limpias" value="true" {% if auditoria and auditoria.manos_limpias %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Manos limpias</span>
                    </label>

                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if auditoria and auditoria.sin_joyas %}bg-green-50{% endif %}">
                        <input type="checkbox" name="sin_joyas" value="true" {% if auditoria and auditoria.sin_joyas %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Sin joyas</span>
                    </label>

                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if auditoria and auditoria.uniforme_limpio %}bg-green-50{% endif %}">
                        <input type="checkbox" name="uniforme_limpio" value="true" {% if auditoria and auditoria.uniforme_limpio %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Uniforme limpio</span>
                    </label>

                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if auditoria and auditoria.cabello_cubierto %}bg-green-50{% endif %}">
                        <input type="checkbox" name="cabello_cubierto" value="true" {% if auditoria and auditoria.cabello_cubierto %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Cabello cubierto</span>
                    </label>

                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if auditoria and auditoria.calzado_adecuado %}bg-green-50{% endif %}">
                        <input type="checkbox" name="calzado_adecuado" value="true" {% if auditoria and auditoria.calzado_adecuado %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Calzado adecuado</span>
                    </label>

                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if auditoria and auditoria.sin_lesiones_visibles %}bg-green-50{% endif %}">
                        <input type="checkbox" name="sin_lesiones_visibles" value="true" {% if auditoria and auditoria.sin_lesiones_visibles %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Sin lesiones visibles</span>
                    </label>

                    <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors {% if auditoria and auditoria.lavado_manos_correcto %}bg-green-50{% endif %}">
                        <input type="checkbox" name="lavado_manos_correcto" value="true" {% if auditoria and auditoria.lavado_manos_correcto %}checked{% endif %} class="h-5 w-5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                        <span class="text-sm text-gray-700">Lavado de manos correcto</span>
                    </label>
                </div>
            </div>

            <!-- Observaciones -->
            <div>
                <label for="observaciones" class="block text-sm font-medium text-gray-700 mb-1">Observaciones</label>
                <textarea name="observaciones" id="observaciones" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Observaciones adicionales...">{{ auditoria.observaciones if auditoria else '' }}</textarea>
            </div>

            <div class="flex justify-end space-x-4 pt-4 border-t border-gray-200">
                <a href="/higiene" class="px-4 py-2 border border-gray-300 rounded-lg font-medium text-gray-700 hover:bg-gray-50 transition-colors">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 transition-colors">
                    {% if auditoria %}Actualizar{% else %}Guardar{% endif %} Auditoría
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
