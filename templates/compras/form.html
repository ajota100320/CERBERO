{% extends "base.html" %}

{% block title %}{{ title }} - ERP Gastronómico{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">{{ title }}</h1>
            <p class="text-gray-500 mt-1">Registrar nueva compra con múltiples ingredientes</p>
        </div>
        <a href="/compras" class="text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <form method="POST" action="{{ action }}" class="space-y-6" id="compraForm">
            <!-- Header Info -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 border-b border-gray-200 pb-6">
                <div>
                    <label for="numero_factura" class="block text-sm font-medium text-gray-700 mb-1">N° Factura <span class="text-red-500">*</span></label>
                    <input type="text" name="numero_factura" id="numero_factura" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="FAC-001">
                </div>
                <div>
                    <label for="proveedor_id" class="block text-sm font-medium text-gray-700 mb-1">Proveedor <span class="text-red-500">*</span></label>
                    <select name="proveedor_id" id="proveedor_id" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <option value="">Seleccionar proveedor</option>
                        {% for prov in proveedores %}
                        <option value="{{ prov.id }}">{{ prov.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="fecha_compra" class="block text-sm font-medium text-gray-700 mb-1">Fecha <span class="text-red-500">*</span></label>
                    <input type="date" name="fecha_compra" id="fecha_compra" required value="{{ today }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">&nbsp;</label>
                    <div class="flex items-center">
                        <span class="text-gray-500">Items: <span id="itemCount">0</span></span>
                    </div>
                </div>
            </div>

            <!-- Detalle Items -->
            <div>
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-900">Detalle de la Compra</h3>
                    <button type="button" onclick="addItem()" class="text-primary-600 hover:text-primary-700 text-sm font-medium flex items-center space-x-1">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        <span>Agregar Item</span>
                    </button>
                </div>
                
                <div id="itemsContainer" class="space-y-4">
                    <!-- Items will be added here -->
                </div>
            </div>

            <!-- Observaciones -->
            <div>
                <label for="observaciones" class="block text-sm font-medium text-gray-700 mb-1">Observaciones</label>
                <textarea name="observaciones" id="observaciones" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Observaciones adicionales"></textarea>
            </div>

            <div class="flex justify-end space-x-4 pt-4 border-t border-gray-200">
                <a href="/compras" class="px-4 py-2 border border-gray-300 rounded-lg font-medium text-gray-700 hover:bg-gray-50 transition-colors">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 transition-colors">Crear Compra</button>
            </div>
        </form>
    </div>
</div>

<script>
// Ingredientes disponibles
const ingredientes = {{ ingredientes_json | tojson }};

let itemIndex = 0;

function addItem() {
    const container = document.getElementById('itemsContainer');
    const div = document.createElement('div');
    div.className = 'bg-gray-50 rounded-lg p-4 border border-gray-200 item-row';
    div.innerHTML = `
        <div class="flex items-start space-x-4">
            <div class="flex-1">
                <label class="block text-sm font-medium text-gray-700 mb-1">Ingrediente <span class="text-red-500">*</span></label>
                <select name="ingrediente_id" required onchange="updateCostoPromedio(this)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                    <option value="">Seleccionar ingrediente</option>
                    ${ingredientes.map(ing => `<option value="${ing.id}" data-costo="${ing.costo_promedio}">${ing.nombre} (${ing.unidad_medida}) - $${ing.costo_promedio}</option>`).join('')}
                </select>
            </div>
            <div class="w-32">
                <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad <span class="text-red-500">*</span></label>
                <input type="number" name="cantidad" required step="0.01" min="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="0.00">
            </div>
            <div class="w-32">
                <label class="block text-sm font-medium text-gray-700 mb-1">Costo Unit. <span class="text-red-500">*</span></label>
                <input type="number" name="costo_unitario" required step="0.01" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="0.00">
            </div>
            <div class="w-36">
                <label class="block text-sm font-medium text-gray-700 mb-1">Vencimiento</label>
                <input type="date" name="fecha_vencimiento" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
            </div>
            <div class="w-28">
                <label class="block text-sm font-medium text-gray-700 mb-1">Lote</label>
                <input type="text" name="lote" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="Lote">
            </div>
            <button type="button" onclick="removeItem(this)" class="text-red-600 hover:text-red-700 mt-10 flex-shrink-0" title="Eliminar">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    `;
    container.appendChild(div);
    updateItemCount();
}

function removeItem(btn) {
    btn.closest('.item-row').remove();
    updateItemCount();
}

function updateCostoPromedio(select) {
    const option = select.options[select.selectedIndex];
    const costo = option.dataset.costo;
    if (costo) {
        const row = select.closest('.item-row');
        const costoInput = row.querySelector('input[name="costo_unitario"]');
        if (costoInput && !costoInput.value) {
            costoInput.value = costo;
        }
    }
}

function updateItemCount() {
    const count = document.querySelectorAll('.item-row').length;
    document.getElementById('itemCount').textContent = count;
}

// Add first item on load
document.addEventListener('DOMContentLoaded', () => {
    addItem();
});
</script>
{% endblock %}
